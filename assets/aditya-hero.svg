<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="akh-title akh-desc">
  <title id="akh-title">Aditya Kushwaha — Finance, Fund Accounting, Compliance, MIS Reporting</title>
  <desc id="akh-desc">Burgundy banner with name, role line, a rising line chart and orbital geometry.</desc>
  <defs>
    <linearGradient id="akh-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#2A0E1B"/>
    </linearGradient>
    <radialGradient id="akh-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="akh-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset="0.5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#E5B5C7"/>
    </linearGradient>
    <linearGradient id="akh-under" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="akh-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
    <pattern id="akh-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#E5B5C7" stroke-width="0.5"/>
    </pattern>
    <filter id="akh-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#akh-bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#akh-grid)" opacity="0.06"/>

  <!-- drifting light -->
  <ellipse cx="300" cy="180" rx="420" ry="240" fill="url(#akh-glow)">
    <animate attributeName="cx" values="260;520;260" dur="14s" repeatCount="indefinite"/>
  </ellipse>

  <!-- orbital geometry -->
  <g transform="translate(965 180)" fill="none">
    <circle r="118" stroke="#451126" stroke-width="1"/>
    <g>
      <ellipse rx="150" ry="58" stroke="#701A3D" stroke-width="1" opacity="0.8"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse rx="150" ry="58" stroke="#C77B9B" stroke-width="0.8" opacity="0.45" transform="rotate(60)"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="80s" repeatCount="indefinite"/>
    </g>
    <circle r="4" fill="#E5B5C7">
      <animateMotion dur="12s" repeatCount="indefinite" path="M150 0A150 58 0 1 1 -150 0A150 58 0 1 1 150 0"/>
    </circle>
  </g>

  <!-- rising line chart -->
  <g transform="translate(800 70)">
    <path d="M0 210 L40 188 L80 196 L120 160 L160 170 L200 128 L240 138 L280 92 L320 104 L360 52 L360 230 L0 230Z" fill="url(#akh-area)">
      <animate attributeName="opacity" values="0;1" dur="2.5s" fill="freeze"/>
    </path>
    <path d="M0 210 L40 188 L80 196 L120 160 L160 170 L200 128 L240 138 L280 92 L320 104 L360 52" fill="none" stroke="url(#akh-line)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="520" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="520;0;0;520" keyTimes="0;0.35;0.85;1" dur="9s" repeatCount="indefinite"/>
    </path>
    <circle cx="360" cy="52" r="6" fill="#E5B5C7" filter="url(#akh-soft)">
      <animate attributeName="r" values="4;9;4" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="360" cy="52" r="3.5" fill="#F8F0F3"/>
  </g>

  <!-- text -->
  <text x="72" y="104" fill="#C77B9B" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="4">MBA (FINANCE) · CHRIST UNIVERSITY · BENGALURU</text>
  <text x="70" y="186" fill="#F8F0F3" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="700">Aditya Kushwaha</text>

  <rect x="72" y="212" width="520" height="2" fill="url(#akh-under)">
    <animate attributeName="width" values="60;520;520;60" keyTimes="0;0.3;0.8;1" dur="9s" repeatCount="indefinite"/>
  </rect>
  <rect x="72" y="209" width="520" height="8" fill="url(#akh-under)" opacity="0.35" filter="url(#akh-soft)">
    <animate attributeName="width" values="60;520;520;60" keyTimes="0;0.3;0.8;1" dur="9s" repeatCount="indefinite"/>
  </rect>

  <text x="72" y="256" fill="#E5B5C7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22">Fund Accounting · NAV · Reconciliations · KYC/AML</text>
  <text x="72" y="292" fill="#C77B9B" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" opacity="0.9">Excel · SQL · Python · Power BI · SAP FICO</text>
</svg>
