<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-labelledby="akf-title">
  <title id="akf-title">Aditya Kushwaha — footer</title>
  <defs>
    <linearGradient id="akf-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.5" stop-color="#190B12"/>
      <stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <linearGradient id="akf-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#451126" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#701A3D"/>
      <stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="akf-spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#E5B5C7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="110" rx="14" fill="url(#akf-bg)"/>
  <rect x="100" y="38" width="1000" height="1.5" fill="url(#akf-rule)"/>
  <ellipse cx="100" cy="38.75" rx="40" ry="4" fill="url(#akf-spark)">
    <animate attributeName="cx" values="100;1100;100" dur="10s" repeatCount="indefinite"/>
  </ellipse>
  <text x="600" y="74" text-anchor="middle" fill="#E5B5C7" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic">Good numbers inform decisions; well-controlled numbers earn trust.</text>
  <text x="600" y="96" text-anchor="middle" fill="#C77B9B" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3">ADITYA KUSHWAHA · BENGALURU</text>
</svg>
