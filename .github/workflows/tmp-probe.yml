name: tmp-probe
on: [push]
jobs:
  run:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'tmp-probe')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q requests huggingface_hub pandas pyarrow
      - run: python .github/tmp/probe.py
