name: tmp-data
on: [push]
jobs:
  run:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'tmp-data')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q yfinance pandas
      - run: python .github/tmp/peers.py
